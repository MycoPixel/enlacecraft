<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EnlaceCraft</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg, #fff); color: var(--fg, #1b2027); }
    #editor { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
    #msg { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; font: 13px sans-serif;
           background: #fdecea; color: #8a1c13; display: none; }
  </style>
  <!-- ONLYOFFICE ships its plugin SDK beside the plugin; the CDN copy is a
       fallback for hosts that do not, and is the only network request this
       wrapper can make. -->
  <script src="../v1/plugins.js"></script>
  <script>
    if (!(window.Asc && window.Asc.plugin))
      document.write('<script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"><\/script>');
  </script>
  <script src="bridge.js"></script>
  <script src="insert.js"></script>
  <script src="plugin.js"></script>
</head>
<body>
  <iframe id="editor" title="EnlaceCraft"></iframe>
  <div id="msg"></div>
</body>
</html>
