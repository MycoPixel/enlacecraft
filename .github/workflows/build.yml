# Builds the desktop installers for Linux and Windows.
#
# WHY THIS EXISTS
# ---------------
# All three bundled Python backends are frozen with PyInstaller, which cannot
# cross-compile - a Linux build has to happen on Linux and a Windows build on
# Windows. That used to mean freezing three backends by hand on two machines,
# hand-copying ~1.5GB of generated output into resources/, keeping two package
# .json versions in sync by hand, then publishing each platform's installer
# separately. This does all of it from one push.
#
# IT BUILDS, IT DOESN'T PUBLISH
# -----------------------------
# The installers are uploaded as workflow artifacts. Publishing to
# MycoPixel/enlacecraft-releases is left as a deliberate manual step, so no
# token with write access to a second repository is needed in CI, and nothing
# can ship without a human deciding to. To release: download the artifacts,
# create the release at the package.json version, attach the installer *and*
# its latest*.yml manifest, then publish the (draft) release - electron-updater
# reads the .yml, not the installer, so an installer with no manifest silently
# never registers as an update.
#
# TRIGGERS
# --------
# workflow_dispatch for an on-demand run, or a push to main that touches
# something that changes the *output* (the Python backends, the Electron
# layer, the version, packaging config). Renderer-only changes under src/ are
# deliberately NOT a trigger: each run freezes three backends and downloads
# several GB, which is a lot of runner time to burn for a tweak that only
# changes the JS bundle. Ask for a run manually when you want one.
name: build installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - electron/**
      - python/**
      - build/**
      - .gitmodules
      - .github/workflows/build.yml

# Don't let a broken push queue up a dozen expensive runs - cancel the older
# one for the same ref instead.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Pin what the built-in GITHUB_TOKEN can do, rather than inheriting whatever
# the repository default happens to be.
#
# The default GITHUB_TOKEN is scoped to THIS repository only - it cannot read
# the private NMRGraph submodule, which is what SUBMODULE_TOKEN is for (see the
# checkout step in the build job). So nothing here is needed for the build to
# work; this exists so the blast radius is explicit rather than implicit.
#
# This workflow only ever reads and builds. It uploads artifacts (which needs
# no repo write) and never pushes, creates releases, or touches PRs - releases
# are a deliberate manual step, see the header. So contents:read is the whole
# list. If a future step needs more, it should say so here rather than
# inheriting a broader default that nobody chose on purpose.
permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cheap gate before the expensive matrix below: a red unit test should
      # fail in two minutes, not after two platforms have each spent half an
      # hour freezing Python backends.
      - run: npm test

  package:
    name: ${{ matrix.platform }} installer
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't cancel the other - you want to know
      # about both in one run, not discover the second problem later.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    env:
      # Point the Electron download cache at a workspace path so one cache
      # entry works on both operating systems (the default locations are
      # ~/.cache/... on Linux and %LOCALAPPDATA% on Windows).
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron

    steps:
      # Fail loudly and specifically if the secret is missing. Without it,
      # checkout's submodule clone just dies with "remote: Repository not
      # found", which looks like a permissions problem in a repo that has
      # none - see the comment on the checkout step below for the real cause.
      - name: Check the submodule token is configured
        shell: bash
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          if [ -z "$SUBMODULE_TOKEN" ]; then
            echo "ERROR: the SUBMODULE_TOKEN secret is not set." >&2
            echo >&2
            echo "python/NMRGraph is a PRIVATE repo, so Actions' default" >&2
            echo "GITHUB_TOKEN cannot clone it - that token is scoped to" >&2
            echo "enlacecraft alone, and the submodule clone fails with a" >&2
            echo "misleading 'Repository not found'." >&2
            echo >&2
            echo "Create a fine-grained PAT with Contents:read on" >&2
            echo "MycoPixel/NMRGraph only, and add it as the repository" >&2
            echo "secret SUBMODULE_TOKEN (Settings > Secrets and variables" >&2
            echo "> Actions)." >&2
            exit 1
          fi
          echo "SUBMODULE_TOKEN is set"

      - uses: actions/checkout@v4
        with:
          # NMRGraph is a submodule, and the build needs it: without this the
          # backend source and the model checkpoints are simply absent and the
          # freeze has nothing to freeze. The token is required because that
          # repo is private and the default GITHUB_TOKEN can't reach it.
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
          # Don't write the token into python/NMRGraph/.git/config.
          #
          # checkout does this by default so later steps can fetch, but nothing
          # after this one pushes or fetches - it exists purely to put NMRGraph
          # on disk for PyInstaller. Leaving the credential in the checkout's
          # git config means a read-scoped token sits in a file for the rest of
          # the job, where any later step (or a debugging command someone pastes
          # in to diagnose a failure) could reach it. The artifact step uploads
          # explicit release/*.exe globs rather than the workspace, so it isn't
          # leaking today - this removes the reason to have to check that.
          persist-credentials: false

      # --- Reclaim disk before doing the heavy work -------------------
      # The Linux runner ran out of space building the AppImage (ENOSPC).
      #
      # The arithmetic: resources/ holds 2.6GB of frozen PyInstaller backends,
      # and electron-builder copies all of it into release/linux-unpacked/
      # before squashing it into the AppImage - so ~5.2GB for the backends
      # alone, twice over. Add node_modules, the npm cache and the Electron
      # download and that's most of a stock runner's disk before it has built
      # anything.
      #
      # So delete the toolchains this build never touches - they're images for
      # jobs we're not running: dotnet, the Android SDK, GHC, Boost, the
      # PowerShell install. Together that's several GB and none of it is
      # touched by freezing Python backends or building an Electron AppImage.
      #
      # Deliberately NOT deleting $AGENT_TOOLSDIRECTORY, which several guides
      # include and which frees more. It also holds the preinstalled Node that
      # the setup-node step below resolves against, and a failed freeze is a
      # long run to lose. The four toolchains are enough slack, so take the
      # option that can't break a later step.
      #
      # Kept as its own step before setup-node so nothing can be deleted out
      # from under a cache action, and it prints df either side so a future
      # failure here is diagnosable from the log instead of mysterious.
      #
      # Windows runners have more room and didn't need this, hence Linux-only.
      - name: Reclaim disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "before:"
          df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/share/powershell
          # The Android SDK leaves AVD and emulator images behind even after
          # the SDK tree goes; without this the reclaim is only partial.
          sudo rm -rf /root/Android
          echo "after:"
          df -h / | tail -1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ matrix.platform }}-${{ hashFiles('package-lock.json') }}

      # --- Freeze the three backends -------------------------------------
      # Each script freezes, verifies and copies into resources/. They fail the
      # build on a glibc floor above MAX_GLIBC, or on a smoke test that doesn't
      # exercise a real request - which is how 1.7.1 shipped three backends
      # that couldn't start on any real user's Linux.
      - name: Freeze backends (Linux)
        if: runner.os == 'Linux'
        run: |
          ./python/freeze_in_container.sh
          ./python/freeze_structure3d.sh
          ./python/freeze_iupac.sh

      - name: Freeze backends (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./python/freeze_windows.ps1

      - run: npm ci

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        # --publish never is explicit on purpose: electron-builder will
        # otherwise try to publish whenever it detects a CI environment, and
        # this job has no token for the separate releases repo.
        run: npm run dist:linux -- --publish never

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        run: npm run dist:win -- --publish never

      - name: Verify the updater manifest exists
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(ls release/latest*.yml 2>/dev/null | head -1 || true)
          if [ -z "$manifest" ]; then
            echo "ERROR: no latest*.yml in release/ - electron-updater reads the" >&2
            echo "       manifest, not the installer, so a release without one" >&2
            echo "       would silently never register as an update." >&2
            ls -la release/ >&2
            exit 1
          fi
          echo "found updater manifest: $manifest"
          # List what the release will actually be assembled from. The missing
          # blockmap went unnoticed because every file that WAS uploaded looked
          # correct - nothing ever printed the full set, so an omission had no
          # signature. A blockmap is a warning, not a failure: generation is
          # best-effort per target and a release without one still updates,
          # just by downloading in full.
          echo "release contents:"
          ls -la release/ | grep -vE '^total|^d'
          if ! compgen -G 'release/*.blockmap' >/dev/null; then
            echo "WARNING: no .blockmap produced. Differential updates will fall"
            echo "         back to a full download. Not fatal."
          fi

      # Artifacts, not a release. Download both platforms' outputs from the
      # run summary and attach them to a release by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: enlacecraft-${{ matrix.platform }}-${{ github.run_number }}
          if-no-files-found: error
          # Both the installer and its manifest; the .yml is the small file
          # that's easy to forget and fatal to leave behind.
          #
          # The *.blockmap files matter for the same reason. electron-builder
          # writes them next to each installer, and latest*.yml advertises
          # them (blockMapSize), but they weren't being uploaded - so a release
          # assembled from these artifacts shipped without them, which is how
          # 1.8.0 lost its .exe.blockmap.
          #
          # electron-updater fetches <installer>.blockmap to do a DIFFERENTIAL
          # download - only the chunks that changed, rather than the whole
          # ~700MB file. With it missing, the update either falls back to a
          # full re-download on every release or fails outright, and both look
          # fine in the build logs. The yml already promises these files, so
          # shipping them is just keeping that promise.
          #
          # Not an error if absent: blockmap generation is best-effort and
          # depends on the target. error_no_files_found stays on for the
          # installer itself, which must never be missing.
          path: |
            release/*.AppImage
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/builder-effective-config.yaml

      # The frozen backends are ~2.5GB across the three of them and are already
      # inside the installer, so they aren't uploaded separately.